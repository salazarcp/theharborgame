[build]
  command = "npm run build && npm run check:seo"
  publish = "dist"

[[context.production.plugins]]
  package = "./netlify/plugins/indexnow"

# Redirect the bare index.html to the canonical root so the homepage is not
# reachable under two URLs.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Report-Only first: this reports violations to the browser console without
    # blocking anything. Watch the console, then rename the key to
    # Content-Security-Policy once it is quiet.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; frame-src https://www.youtube-nocookie.com; connect-src 'self' https://*.supabase.co https://www.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'"

# Vite content-hashes everything in /assets/, so a long immutable cache is safe:
# a changed file gets a new filename.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Files in public/ keep their filenames across deploys, so they get a shorter
# window with revalidation instead of a year-long immutable cache.
[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# Internal build artifact: useful to serve, but it should not be indexed.
[[headers]]
  for = "/seo-manifest.json"
  [headers.values]
    X-Robots-Tag = "noindex"
